# Basic Quadrotor Configuration - No Gimbal
# Simple quadrotor for testing flight dynamics and basic operations

vehicle:
  type: "quadrotor_x"           # Standard X configuration
  name: "PX4 Iris Quadrotor"    # Display name

  # Physical configuration - matches PX4 Iris model
  rotor_separation: 0.44        # meters - diagonal distance between motors (Iris spec)
  mass: 1.5                     # kg - total vehicle mass
  motor: "Iris_Motor"           # Reference to motor database

  # Inertia configuration - from PX4 Iris gazebo-classic model
  inertia:
    ixx: 0.029125               # [kg⋅m²]
    iyy: 0.029125               # [kg⋅m²]
    izz: 0.055225               # [kg⋅m²]
    ixy: 0.0                    # [kg⋅m²]
    ixz: 0.0                    # [kg⋅m²]
    iyz: 0.0                    # [kg⋅m²]

  # Body configuration - scaled to match rotor separation
  body:
    dimensions: [0.44, 0.44, 0.08]  # [length, width, height] in meters
    color: [100, 100, 100]          # RGB color values (0-255)

  # Standard sensors
  sensors:
    imu:
      enabled: true
      update_rate: 250              # Hz

    gps:
      enabled: true
      update_rate: 10               # Hz

    barometer:
      enabled: true
      update_rate: 50               # Hz

    magnetometer:
      enabled: true
      update_rate: 250              # Hz

  # No gimbal configuration
  gimbal:
    enabled: false

# Flight characteristics with Iris_Motor:
# - Matches PX4 Iris gazebo-classic model exactly
# - Higher thrust capacity (1100 vs 950 rad/s max RPM)
# - Realistic motor time constants for response
# - Proper inertia matrix for accurate dynamics

# Use cases:
# - Basic flight testing
# - Control algorithm development
# - Sensor integration testing
# - PX4/ArduPilot integration