# Motor Database for EmissarePegasusSimulator
# Essential motor configurations with thrust and physics parameters

motors:
  # PX4 Iris Motor - Exact match to gazebo-classic Iris model
  Iris_Motor:
    rotor_constant: 5.84e-5          # Thrust coefficient [N⋅s²/rad²]
    torque_coefficient: 1.0e-5       # Torque coefficient [N⋅m⋅s²/rad²] - increased for proper yaw control
    max_rotor_velocity: 1100         # Maximum angular velocity [rad/s]
    rotor_radius: 0.089              # Rotor radius [m]

# Notes on Parameters:
# - rotor_constant: Thrust = rotor_constant * (angular_velocity)²
# - torque_coefficient: Torque = torque_coefficient * (angular_velocity)²
# - max_rotor_velocity: Physical limit of motor/ESC combination
# - rotor_radius: Propeller radius for moment calculations