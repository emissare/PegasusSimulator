[pytest]
# Pytest configuration for Pegasus Simulator

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths =
    pegasus/simulator/tests/unit

# Command line options
addopts =
    -v
    --tb=short
    --strict-markers

# Markers for different test categories
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may need Isaac Sim)
    slow: Slow running tests
    coordinate_fix: Tests related to coordinate transformation fix

# Coverage settings
[coverage:run]
source = pegasus/simulator/logic/sensors/calculations
omit =
    */tests/*
    */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    pass

[coverage:html]
directory = htmlcov